name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.2 or 0.1.3-SNAPSHOT)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            ver="${REF_NAME#v}"
          else
            ver="$INPUT_VERSION"
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version: $ver"
            exit 1
          fi
          echo "value=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify tests, Detekt, Spotless, and Binary Compatibility
        run: ./gradlew test detekt spotlessCheck apiCheck -Pversion="${{ steps.version.outputs.value }}" --console=plain

      # Maven Central may temporarily block com.awakekt under monthly namespace file-count quotas.
      # Do not block the signed GitHub Pages Maven mirror (https://awakekt.github.io/release-guard/).
      - name: Publish to Maven Central
        id: central
        continue-on-error: true
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.MAVEN_CENTRAL_DOPPLER_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          [[ -n "$DOPPLER_TOKEN" ]] || {
            echo "::warning::MAVEN_CENTRAL_DOPPLER_TOKEN not set; skipping Maven Central upload."
            exit 0
          }
          doppler run --no-fallback --project maven-central --config prd -- \
            env -u DOPPLER_TOKEN bash -e -o pipefail <<'PUBLISH_CENTRAL'
            [[ "$DOPPLER_PROJECT" == maven-central && "$DOPPLER_CONFIG" == prd ]] || {
              echo "::error::Use a Doppler service token for maven-central/prd."
              exit 1
            }
            for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD GPG_SIGNING_KEY GPG_SIGNING_PASSWORD; do
              [[ -n "${!name}" ]] || { echo "::error::Missing $name in maven-central/prd Doppler config."; exit 1; }
            done
            printf '::add-mask::%s\n' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" "$GPG_SIGNING_PASSWORD"
            while IFS= read -r line; do
              [[ -n "$line" ]] && printf '::add-mask::%s\n' "$line"
            done <<< "$GPG_SIGNING_KEY"

            export ORG_GRADLE_PROJECT_mavenCentralUsername="$MAVEN_CENTRAL_USERNAME"
            export ORG_GRADLE_PROJECT_mavenCentralPassword="$MAVEN_CENTRAL_PASSWORD"
            export ORG_GRADLE_PROJECT_signingInMemoryKey="$GPG_SIGNING_KEY"
            export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="$GPG_SIGNING_PASSWORD"

            ./gradlew publishAndReleaseToMavenCentral -Pversion="$RELEASE_VERSION" --no-configuration-cache --console=plain
          PUBLISH_CENTRAL

      # Zero-token public Maven repository served at https://awakekt.github.io/release-guard/
      - name: Publish signed Maven repository to GitHub Pages (gh-pages)
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.MAVEN_CENTRAL_DOPPLER_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          export PAGES_DIR="$RUNNER_TEMP/gh-pages"
          rm -rf "$PAGES_DIR"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PAGES_DIR"
          else
            mkdir -p "$PAGES_DIR"
            git -C "$PAGES_DIR" init -b gh-pages
            git -C "$PAGES_DIR" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          touch "$PAGES_DIR/.nojekyll"

          if [[ -n "$DOPPLER_TOKEN" ]]; then
            doppler run --no-fallback --project maven-central --config prd -- \
              env -u DOPPLER_TOKEN bash -e -o pipefail <<'PUBLISH_PAGES'
              printf '::add-mask::%s\n' "$GPG_SIGNING_PASSWORD"
              while IFS= read -r line; do
                [[ -n "$line" ]] && printf '::add-mask::%s\n' "$line"
              done <<< "$GPG_SIGNING_KEY"
              export ORG_GRADLE_PROJECT_signingInMemoryKey="$GPG_SIGNING_KEY"
              export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="$GPG_SIGNING_PASSWORD"
              ./gradlew publishAllPublicationsToPagesStagingRepository \
                -Pversion="$RELEASE_VERSION" \
                -PreleaseGuard.stagingDir="$PAGES_DIR" \
                --no-configuration-cache --console=plain
          PUBLISH_PAGES
          else
            ./gradlew publishAllPublicationsToPagesStagingRepository \
              -Pversion="$RELEASE_VERSION" \
              -PreleaseGuard.stagingDir="$PAGES_DIR" \
              --no-configuration-cache --console=plain
          fi

          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add -A
          if ! git -C "$PAGES_DIR" diff --cached --quiet; then
            git -C "$PAGES_DIR" commit -m "chore(pages): publish Release Guard ${RELEASE_VERSION}"
            git -C "$PAGES_DIR" push -u origin gh-pages
          fi

      - name: Publish mirror to GitHub Packages and build CLI distribution
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository :release-guard-cli:distZip -Pversion="${{ steps.version.outputs.value }}" --no-configuration-cache --console=plain

      - name: Create GitHub Release with CLI distribution
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v${RELEASE_VERSION}"
          zip_path="release-guard-cli/build/distributions/release-guard-cli-${RELEASE_VERSION}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip_path" --clobber
          else
            gh release create "$tag" "$zip_path" --title "$tag" --generate-notes
          fi
