name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0 or 0.1.0-SNAPSHOT)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            ver="${REF_NAME#v}"
          else
            ver="$INPUT_VERSION"
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version: $ver"
            exit 1
          fi
          echo "value=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify tests, Detekt, Spotless, and Binary Compatibility
        run: ./gradlew test detekt spotlessCheck apiCheck -Pversion="${{ steps.version.outputs.value }}" --console=plain

      - name: Publish Maven artifacts and Gradle plugin to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository :release-guard-cli:distZip -Pversion="${{ steps.version.outputs.value }}" --console=plain

      - name: Create GitHub Release with CLI distribution
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v${RELEASE_VERSION}"
          zip_path="release-guard-cli/build/distributions/release-guard-cli-${RELEASE_VERSION}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip_path" --clobber
          else
            gh release create "$tag" "$zip_path" --title "$tag" --generate-notes
          fi
